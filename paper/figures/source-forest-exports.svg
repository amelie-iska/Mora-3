<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Complete source-prefix exports</title><desc id="desc">Three retained numerical references preserve all source nodes and produce four, twenty-eight and thirty-four prefix states, each with eight untrained diagnostic coordinates. They remain evaluation-only.</desc><rect width="1200" height="560" fill="#f7f8fa"/><g font-family="Arial,sans-serif" fill="#172536"><text x="52" y="55" font-size="30" font-weight="700">Complete source-prefix exports</text><text x="52" y="88" font-size="17">Original computations → complete execution prefixes → fixed native coordinates</text><g font-size="15" fill="#526173"><text x="52" y="143">RETAINED REFERENCE</text><text x="400" y="143">SOURCE NODES</text><text x="640" y="143">PREFIX STATES</text><text x="890" y="143">EXPORTED AXES</text></g><path d="M52 233 H1145" stroke="#dce2e7"/><text x="52" y="195" font-size="23">photonic-0</text><text x="435" y="195" font-size="29" font-weight="700">6</text><path d="M515 185 H600 l-10 -5 m10 5 l-10 5" fill="none" stroke="#6b7a8c" stroke-width="2"/><text x="684" y="195" font-size="29" font-weight="700">4</text><path d="M765 185 H850 l-10 -5 m10 5 l-10 5" fill="none" stroke="#6b7a8c" stroke-width="2"/><text x="895" y="195" font-size="29" fill="#185b81">4 × 8</text><path d="M52 329 H1145" stroke="#dce2e7"/><text x="52" y="291" font-size="23">tropical-attention</text><text x="435" y="291" font-size="29" font-weight="700">59</text><path d="M515 281 H600 l-10 -5 m10 5 l-10 5" fill="none" stroke="#6b7a8c" stroke-width="2"/><text x="684" y="291" font-size="29" font-weight="700">28</text><path d="M765 281 H850 l-10 -5 m10 5 l-10 5" fill="none" stroke="#6b7a8c" stroke-width="2"/><text x="895" y="291" font-size="29" fill="#185b81">28 × 8</text><path d="M52 425 H1145" stroke="#dce2e7"/><text x="52" y="387" font-size="23">causal-soft-moe</text><text x="435" y="387" font-size="29" font-weight="700">66</text><path d="M515 377 H600 l-10 -5 m10 5 l-10 5" fill="none" stroke="#6b7a8c" stroke-width="2"/><text x="684" y="387" font-size="29" font-weight="700">34</text><path d="M765 377 H850 l-10 -5 m10 5 l-10 5" fill="none" stroke="#6b7a8c" stroke-width="2"/><text x="895" y="387" font-size="29" fill="#185b81">34 × 8</text><text x="52" y="497" font-size="17">No source truncation · exact export-byte readback · original split: test</text><text x="52" y="528" font-size="17" fill="#8a451d">Untrained diagnostic encoder. No biological validation or training admission.</text></g></svg>