<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="architecture-title architecture-desc"><title id="architecture-title">Source-bound graph reasoning</title><desc id="architecture-desc">Construction, empirical quality and full training admission are separate requirements.</desc><defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175c7b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#182637"><text x="30" y="40" font-size="25" font-weight="700">Source-bound graph reasoning</text><text x="30" y="68" font-size="14" fill="#536477">Architecture / mathematical illustration — not an empirical result</text><g class="diagram-node" data-detail="Native molecular, protein, cell, image and bioelectric payloads keep original units, masks, axes and evidence classes. No fabricated joins." role="button" tabindex="0" aria-label="Native records"><rect x="30" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="48" y="138" font-size="19" font-weight="700">Native records</text><text x="48" y="165" font-size="15" fill="#536477">Values · axes · masks</text><text x="48" y="186" font-size="15" fill="#536477">Units · provenance · rights</text></g><g class="diagram-node" data-detail="All registered heads share the exact designated native geometry/TokenGT objects. Unique parameters and all aliases must be accounted for." role="button" tabindex="0" aria-label="Shared native owner"><rect x="390" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="408" y="138" font-size="19" font-weight="700">Shared native owner</text><text x="408" y="165" font-size="15" fill="#536477">Exact parameter aliases</text><text x="408" y="186" font-size="15" fill="#536477">Known context only</text></g><g class="diagram-node" data-detail="The normalized prefix policy samples an ordered variable-size topology. The continuous field then denoises all free latent coordinates conditional on that topology." role="button" tabindex="0" aria-label="Topology → latent flow"><rect x="750" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="768" y="138" font-size="19" font-weight="700">Topology → latent flow</text><text x="768" y="165" font-size="15" fill="#536477">Given roots; generate branches</text><text x="768" y="186" font-size="15" fill="#536477">Then jointly denoise the forest</text></g><g class="diagram-node" data-detail="Flow targets, token reconstructions, quality candidates, analogy correspondences and topology labels have distinct source roles. Missing labels stay unavailable." role="button" tabindex="0" aria-label="Supervision roles"><rect x="30" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="48" y="338" font-size="19" font-weight="700">Supervision roles</text><text x="48" y="365" font-size="15" fill="#536477">Original train records</text><text x="48" y="386" font-size="15" fill="#536477">Detached targets and masks</text></g><g class="diagram-node" data-detail="Retrieval proposes train-only group-disjoint memories. Directed relations, costs, native geometry and persistent features constrain but do not prove biological analogy." role="button" tabindex="0" aria-label="Geometry + analogy"><rect x="390" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="408" y="338" font-size="19" font-weight="700">Geometry + analogy</text><text x="408" y="365" font-size="15" fill="#536477">Whole-trajectory retrieval</text><text x="408" y="386" font-size="15" fill="#536477">Directed relation witnesses</text></g><g class="diagram-node" data-detail="The complete latent forest is refined into permitted token embeddings, then independently checked. A learned score is not a biological validity certificate." role="button" tabindex="0" aria-label="Decode + independently check"><rect x="750" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="768" y="338" font-size="19" font-weight="700">Decode + independently check</text><text x="768" y="365" font-size="15" fill="#536477">Finite token refinement</text><text x="768" y="386" font-size="15" fill="#536477">Several outputs or shortfall</text></g><path d="M330 172 L390 172" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#architecture-arrow)"/><path d="M690 172 L750 172" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#architecture-arrow)"/><path d="M900 235 L900 310" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#architecture-arrow)"/><path d="M180 235 L180 310" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#architecture-arrow)"/><text x="180.0" y="263.5" text-anchor="middle" font-size="13" fill="#536477">role split</text><path d="M330 372 L390 372" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#architecture-arrow)"/><path d="M690 372 L750 372" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#architecture-arrow)"/><text x="30" y="480" font-size="14" fill="#94531e">Construction, empirical quality and full training admission are separate requirements.</text></g></svg>