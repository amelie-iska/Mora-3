<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="450" viewBox="0 0 1080 450" role="img" aria-labelledby="directed-title directed-desc"><title id="directed-title">Directed squares preserve more than reachability</title><desc id="directed-desc">Two typed parallel routes become equivalent only under an explicit declared square relation.</desc><defs><marker id="directed-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175c7b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#182637"><text x="30" y="40" font-size="25" font-weight="700">Directed squares preserve more than reachability</text><text x="30" y="68" font-size="14" fill="#536477">Architecture / mathematical illustration — not an empirical result</text><path d="M128 150 L382 150" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#directed-arrow)"/><text x="255.0" y="141.0" text-anchor="middle" font-size="13" fill="#536477">f</text><path d="M100 178 L100 287" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#directed-arrow)"/><text x="100.0" y="223.5" text-anchor="middle" font-size="13" fill="#536477">g</text><path d="M410 178 L410 287" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#directed-arrow)"/><text x="410.0" y="223.5" text-anchor="middle" font-size="13" fill="#536477">h</text><path d="M128 315 L382 315" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#directed-arrow)"/><text x="255.0" y="306.0" text-anchor="middle" font-size="13" fill="#536477">k</text><circle cx="100" cy="150" r="26" fill="#f3f6f8" stroke="#175c7b"/><text x="100" y="157" text-anchor="middle" font-size="22">A</text><circle cx="410" cy="150" r="26" fill="#f3f6f8" stroke="#175c7b"/><text x="410" y="157" text-anchor="middle" font-size="22">B</text><circle cx="100" cy="315" r="26" fill="#f3f6f8" stroke="#175c7b"/><text x="100" y="322" text-anchor="middle" font-size="22">C</text><circle cx="410" cy="315" r="26" fill="#f3f6f8" stroke="#175c7b"/><text x="410" y="322" text-anchor="middle" font-size="22">D</text><rect x="175" y="192" width="175" height="80" fill="#edf3f6" stroke="#c7d4df" stroke-dasharray="6 5"/><text class="square-label" x="262" y="225" text-anchor="middle" font-size="17">declared square</text><text class="square-equivalence" x="262" y="250" text-anchor="middle" font-size="17">h ∘ f ~ k ∘ g</text><g class="diagram-node" data-detail="Endpoint-compatible generator maps extend to a quotient functor exactly when every defining relation maps to an equivalent target pair." role="button" tabindex="0" aria-label="Quotient functor"><rect x="565" y="125" width="470" height="135" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="583" y="153" font-size="19" font-weight="700">Quotient functor</text><text x="583" y="180" font-size="15" fill="#536477">Objects → objects</text><text x="583" y="201" font-size="15" fill="#536477">Generators → directed paths</text><text x="583" y="222" font-size="15" fill="#536477">Relations → checked witnesses</text></g><text x="565" y="300" font-size="16">No reverse path is inserted automatically.</text><text x="565" y="329" font-size="16">No witness / exhausted search budget → unknown.</text><text x="30" y="410" font-size="14" fill="#94531e">A finite relation certificate is not a proof of continuous realization or biological causality.</text></g></svg>