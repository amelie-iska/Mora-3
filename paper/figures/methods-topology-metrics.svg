<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="metrics-title metrics-desc"><title id="metrics-title">Geometry, persistence and directed structure</title><desc id="metrics-desc">Complete diagram information, latent geometry and biological semantics are not interchangeable.</desc><defs><marker id="metrics-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175c7b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#182637"><text x="30" y="40" font-size="25" font-weight="700">Geometry, persistence and directed structure</text><text x="30" y="68" font-size="14" fill="#536477">Architecture / mathematical illustration — not an empirical result</text><g class="diagram-node" data-detail="Fix source coordinates, units, periodicity and relation signs. Pairwise Euclidean distances cannot distinguish mirror chirality by themselves." role="button" tabindex="0" aria-label="Native geometry"><rect x="30" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="48" y="138" font-size="19" font-weight="700">Native geometry</text><text x="48" y="165" font-size="15" fill="#536477">Coordinates · units · signs</text><text x="48" y="186" font-size="15" fill="#536477">Do not erase chirality</text></g><g class="diagram-node" data-detail="Compute the bounded supported homology and retain source diagrams. Incomplete filtrations and essential features require explicit treatment." role="button" tabindex="0" aria-label="Complete persistence"><rect x="390" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="408" y="138" font-size="19" font-weight="700">Complete persistence</text><text x="408" y="165" font-size="15" fill="#536477">Declared filtration / field</text><text x="408" y="186" font-size="15" fill="#536477">Essential and censored bars kept</text></g><g class="diagram-node" data-detail="A shared collection-specific knot basis and all landscape layers make squared differences piecewise quadratic; two-point Gaussian integration is exact in real arithmetic." role="button" tabindex="0" aria-label="Exact finite landscapes"><rect x="750" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="768" y="138" font-size="19" font-weight="700">Exact finite landscapes</text><text x="768" y="165" font-size="15" fill="#536477">All layers + common knots</text><text x="768" y="186" font-size="15" fill="#536477">Two-point Gauss → Euclidean L2</text></g><g class="diagram-node" data-detail="A finite directed presentation preserves typed path relations. Its quotient functor witnesses and integer chain identities remain separate from ordinary persistence." role="button" tabindex="0" aria-label="Directed presentation"><rect x="30" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="48" y="338" font-size="19" font-weight="700">Directed presentation</text><text x="48" y="365" font-size="15" fill="#536477">Paths · squares · chain maps</text><text x="48" y="386" font-size="15" fill="#536477">Evidence-backed directions</text></g><g class="diagram-node" data-detail="Sampled landscapes and persistence images are not universally lossless. Report domain, resolution, layers and precision; never compare incompatible bases." role="button" tabindex="0" aria-label="Sampled / image features"><rect x="390" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="408" y="338" font-size="19" font-weight="700">Sampled / image features</text><text x="408" y="365" font-size="15" fill="#536477">Fixed grids or smoothing</text><text x="408" y="386" font-size="15" fill="#536477">Explicit approximation</text></g><g class="diagram-node" data-detail="Use approximate features for explicitly approximate retrieval and exact finite distances for a complete bounded rerank where qualified. None proves biological equivalence." role="button" tabindex="0" aria-label="Qualified comparison"><rect x="750" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="768" y="338" font-size="19" font-weight="700">Qualified comparison</text><text x="768" y="365" font-size="15" fill="#536477">Compare compatible axes</text><text x="768" y="386" font-size="15" fill="#536477">No universal equivalence claim</text></g><path d="M330 172 L390 172" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#metrics-arrow)"/><path d="M690 172 L750 172" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#metrics-arrow)"/><path d="M180 235 L180 310" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#metrics-arrow)"/><path d="M540 235 L540 310" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#metrics-arrow)"/><path d="M900 235 L900 310" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#metrics-arrow)"/><path d="M690 372 L750 372" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#metrics-arrow)"/><text x="30" y="480" font-size="14" fill="#94531e">Complete diagram information, latent geometry and biological semantics are not interchangeable.</text></g></svg>