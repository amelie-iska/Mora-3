<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figure-contextual-quality-evidence-precedes-preference-training-title figure-contextual-quality-evidence-precedes-preference-training-desc" viewBox="0 0 960 500" width="960" height="500"><title id="figure-contextual-quality-evidence-precedes-preference-training-title">Contextual quality evidence precedes preference training</title><desc id="figure-contextual-quality-evidence-precedes-preference-training-desc">Matched-context GraphCG exploration is assessed through modality-appropriate evidence. DoRA and QDoRA are candidates, QLoRA is the reference baseline, and no outcome is guaranteed.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#526672" stroke-width="1.3"/></marker></defs><rect width="960" height="500" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="25" y="31" fill="#193747" font-size="20" font-weight="650" text-anchor="start">Contextual quality evidence precedes preference training</text><text x="25" y="65" fill="#193747" font-size="16" font-weight="600" text-anchor="start">Steering is conditional; labels require evidence</text><line x1="40" y1="245" x2="390" y2="245" stroke="#c5d0d2" stroke-width="1"  /><line x1="210" y1="100" x2="210" y2="375" stroke="#c5d0d2" stroke-width="1"  /><circle cx="210" cy="245" r="8" fill="#193747"/><text x="222" y="269" fill="#526672" font-size="12" font-weight="400" text-anchor="start">unedited z</text><line x1="210" y1="245" x2="345" y2="140" stroke="#0b756b" stroke-width="3"  marker-end="url(#arrow)"/><line x1="210" y1="245" x2="75" y2="350" stroke="#635394" stroke-width="3"  marker-end="url(#arrow)"/><text x="310" y="118" fill="#0b756b" font-size="18" font-weight="650" text-anchor="start">+ αdₖ</text><text x="60" y="378" fill="#635394" font-size="18" font-weight="650" text-anchor="start">− αdₖ</text><text x="45" y="406" fill="#193747" font-size="15" font-weight="650" text-anchor="start">Same direction + different context</text><text x="45" y="432" fill="#526672" font-size="13" font-weight="400" text-anchor="start">can yield a different quality disposition.</text><text x="460" y="65" fill="#193747" font-size="16" font-weight="600" text-anchor="start">Applicable evidence: protein</text><rect x="460" y="92" width="470" height="66" rx="7" fill="#f6f7f8"/><text x="474" y="115" fill="#193747" font-size="15" font-weight="650" text-anchor="start">Sequence ↔ structure</text><text x="474" y="135" fill="#526672" font-size="11.6" font-weight="400" text-anchor="start">Exact residues, requested backbone and independent</text><text x="474" y="150" fill="#526672" font-size="11.6" font-weight="400" text-anchor="start">compatibility</text><rect x="460" y="169" width="470" height="66" rx="7" fill="#f0f6f4"/><text x="474" y="192" fill="#193747" font-size="15" font-weight="650" text-anchor="start">Stability &amp; assembly</text><text x="474" y="212" fill="#526672" font-size="11.6" font-weight="400" text-anchor="start">Relevant assay or calibrated evidence; preserve legitimate</text><text x="474" y="227" fill="#526672" font-size="11.6" font-weight="400" text-anchor="start">disorder</text><rect x="460" y="246" width="470" height="66" rx="7" fill="#f6f7f8"/><text x="474" y="269" fill="#193747" font-size="15" font-weight="650" text-anchor="start">Function &amp; context</text><text x="474" y="289" fill="#526672" font-size="11.6" font-weight="400" text-anchor="start">Task function, oligomerization and environment are</text><text x="474" y="304" fill="#526672" font-size="11.6" font-weight="400" text-anchor="start">distinct from confidence</text><rect x="460" y="338" width="142" height="25" rx="5" fill="#0b756b" fill-opacity=".09"/><text x="469" y="355" fill="#0b756b" font-size="12" font-weight="600" text-anchor="start">DoRA: candidate</text><rect x="612" y="338" width="153" height="25" rx="5" fill="#206a95" fill-opacity=".09"/><text x="621" y="355" fill="#206a95" font-size="12" font-weight="600" text-anchor="start">QDoRA: candidate</text><rect x="775" y="338" width="153" height="25" rx="5" fill="#526672" fill-opacity=".09"/><text x="784" y="355" fill="#526672" font-size="12" font-weight="600" text-anchor="start">QLoRA: baseline</text><text x="460" y="390" fill="#526672" font-size="13" font-weight="400" text-anchor="start">64 × 64 fixture, rank 8:</text><text x="460" y="418" fill="#193747" font-size="15" font-weight="650" text-anchor="start">LoRA 1024 · DoRA 1088 trainable parameters</text><text x="460" y="444" fill="#526672" font-size="11.8" font-weight="400" text-anchor="start">Row-norm convention. Not the native model parameter count.</text><rect x="25" y="467" width="905" height="25" rx="5" fill="#a15b15" fill-opacity=".09"/><text x="34" y="484" fill="#a15b15" font-size="12" font-weight="600" text-anchor="start">Unknown ≠ failed. Predicted confidence ≠ experimental stability. Co-expression ≠ causation.</text></g></svg>