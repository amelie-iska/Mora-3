name: Import reviewed Mora-3 source

on:
  push:
    branches:
      - publication/import-consolidated-grh-20261113

permissions:
  contents: write

concurrency:
  group: mora3-reviewed-import-f2056c5d
  cancel-in-progress: false

jobs:
  import-reviewed-source:
    if: github.repository == 'amelie-iska/Mora-3'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the unchanged public prerequisite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2bba0f75b8a232d2450c8f0b6af250deeea711cc
          fetch-depth: 0
          persist-credentials: true
          set-safe-directory: false
      - name: Verify the exact source bundle and publish only its review branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          import subprocess
          import urllib.request

          base = '2bba0f75b8a232d2450c8f0b6af250deeea711cc'
          target = 'f2056c5d0ffc5459ac11bab52e518177b0aabb34'
          tree = '8bdd37061884e332cc44b54740c67836bc0829d2'
          branch = 'publication/consolidated-grh-source-20261113'
          expected_hash = '450b0340f7744cc62c2910dff715a53d95fbef12e834fac05e1ed7ce4e982ca2'
          url = 'https://huggingface.co/datasets/AmelieSchreiber/GRH-Mora-ConformerResponse-20261104/resolve/a41218a2c0e2db9ebc02ed1023fe403af24dceb9/integration_sources/mora3/f2056c5d0ffc5459ac11bab52e518177b0aabb34/mora3-source.bundle'

          def git(*args):
              return subprocess.check_output(['git', *args], text=True, timeout=90).strip()

          assert git('rev-parse', 'HEAD') == base
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == base, 'Main moved; reconcile rather than overwrite'
          with urllib.request.urlopen(url, timeout=45) as response:
              raw = response.read(860753)
          assert len(raw) == 860752 and sha256(raw).hexdigest() == expected_hash
          bundle = Path('.mora3-reviewed-source.bundle')
          with bundle.open('xb') as stream:
              stream.write(raw)
          assert git('bundle', 'list-heads', str(bundle)).split() == [target, 'refs/heads/' + branch]
          subprocess.run(['git', 'bundle', 'verify', str(bundle)], check=True, timeout=60)
          subprocess.run(['git', 'fetch', '--no-tags', str(bundle), 'refs/heads/' + branch], check=True, timeout=90)
          assert git('rev-parse', 'FETCH_HEAD') == target
          assert git('rev-parse', target + '^{tree}') == tree
          assert git('rev-list', '--parents', '-n', '1', target).split() == [target, base]
          assert git('rev-list', '--count', base + '..' + target) == '1'
          assert not git('diff', '--name-only', '--diff-filter=D', base, target)
          paths = git('ls-tree', '-r', '--name-only', target).splitlines()
          assert len(paths) == 1640
          forbidden = {'initial_specs_prompt.md', 'keys.txt', '.env', 'AGENTS.md'}
          assert not any(forbidden.intersection(Path(path).parts) for path in paths)
          existing = git('ls-remote', 'origin', 'refs/heads/' + branch)
          if existing:
              assert existing.split()[0] == target, 'Review branch already contains different work'
          else:
              subprocess.run(['git', 'push', 'origin', target + ':refs/heads/' + branch], check=True, timeout=90)
          assert git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0] == target
          assert git('ls-remote', 'origin', 'refs/heads/main').split()[0] == base
          print(json.dumps({'review_branch': branch, 'commit': target, 'tree': tree,
                            'bundle_sha256': expected_hash, 'main_unchanged': True,
                            'training_started': False, 'downloaded_code_executed': False}))
          PY
