<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="topology-title topology-desc"><title id="topology-title">One ordered forest, one depth-first construction</title><desc id="topology-desc">Given roots and ADD_CHILD/CLOSE give one trace for each supported ordered forest.</desc><defs><marker id="topology-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175c7b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#182637"><text x="30" y="40" font-size="25" font-weight="700">One ordered forest, one depth-first construction</text><text x="30" y="68" font-size="14" fill="#536477">Architecture / mathematical illustration — not an empirical result</text><g class="topology-edge" data-target="1"><path d="M161 170 L359 170" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#topology-arrow)"/></g><g class="topology-edge" data-target="2"><path d="M411 170 L609 170" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#topology-arrow)"/></g><g class="topology-edge" data-target="3"><path d="M161 170 L359 295" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#topology-arrow)"/></g><g class="topology-node" data-index="0"><circle cx="135" cy="170" r="29" fill="#175c7b" stroke="#175c7b" stroke-width="2"/><text x="135" y="177" text-anchor="middle" font-size="21" fill="white">r</text></g><g class="topology-node" data-index="1"><circle cx="385" cy="170" r="29" fill="#f3f6f8" stroke="#175c7b" stroke-width="2"/><text x="385" y="177" text-anchor="middle" font-size="21" fill="#182637">a</text></g><g class="topology-node" data-index="2"><circle cx="635" cy="170" r="29" fill="#f3f6f8" stroke="#175c7b" stroke-width="2"/><text x="635" y="177" text-anchor="middle" font-size="21" fill="#182637">b</text></g><g class="topology-node" data-index="3"><circle cx="385" cy="295" r="29" fill="#f3f6f8" stroke="#175c7b" stroke-width="2"/><text x="385" y="302" text-anchor="middle" font-size="21" fill="#182637">c</text></g><g class="diagram-node" data-detail="An ADD creates one new child at the stack top; CLOSE finishes the current node. Children and roots retain a canonical order." role="button" tabindex="0" aria-label="Finite grammar"><rect x="760" y="120" width="280" height="145" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="778" y="148" font-size="19" font-weight="700">Finite grammar</text><text x="778" y="175" font-size="15" fill="#536477">ADD_CHILD or CLOSE</text><text x="778" y="196" font-size="15" fill="#536477">Given root r is clamped</text><text x="778" y="217" font-size="15" fill="#536477">Bounded support only</text></g><text x="30" y="365" font-size="16">Trace: ADD → ADD → CLOSE → CLOSE → ADD → CLOSE → CLOSE</text><text x="30" y="404" font-size="14" fill="#94531e">N = 4, R = 1: exactly 2N − R = 7 decisions. Illustration, not a sampled model result.</text></g></svg>