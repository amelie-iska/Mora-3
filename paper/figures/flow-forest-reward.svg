<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figure-reward-proportional-mass-is-a-distribution-not-a-top-score-choice-title figure-reward-proportional-mass-is-a-distribution-not-a-top-score-choice-desc" viewBox="0 0 960 375" width="960" height="375"><title id="figure-reward-proportional-mass-is-a-distribution-not-a-top-score-choice-title">Reward-proportional mass is a distribution, not a top-score choice</title><desc id="figure-reward-proportional-mass-is-a-distribution-not-a-top-score-choice-desc">A four-object finite example uses an explicit base mass and nonnegative energies. Probabilities sum to one.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#526672" stroke-width="1.3"/></marker></defs><rect width="960" height="375" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="25" y="31" fill="#193747" font-size="20" font-weight="650" text-anchor="start">Reward-proportional mass is a distribution, not a top-score choice</text><text x="25" y="60" fill="#526672" font-size="14" font-weight="400" text-anchor="start">Finite illustration: Rᵢ = q₀ᵢ exp(−Eᵢ / temperature)</text><text x="25" y="112" fill="#193747" font-size="14" font-weight="600" text-anchor="start">Forest 1</text><rect x="130" y="94" width="406.352099055" height="30" rx="3" fill="#0b756b"/><text x="546.352099055" y="115" fill="#193747" font-size="13" font-weight="600" text-anchor="start">62.5%</text><text x="800" y="115" fill="#526672" font-size="12" font-weight="400" text-anchor="start">E=0.2 · q₀=0.4</text><text x="25" y="170" fill="#193747" font-size="14" font-weight="600" text-anchor="start">Forest 2</text><rect x="130" y="152" width="167.258070235" height="30" rx="3" fill="#0b756b"/><text x="307.258070235" y="173" fill="#193747" font-size="13" font-weight="600" text-anchor="start">25.7%</text><text x="800" y="173" fill="#526672" font-size="12" font-weight="400" text-anchor="start">E=0.8 · q₀=0.3</text><text x="25" y="228" fill="#193747" font-size="14" font-weight="600" text-anchor="start">Forest 3</text><rect x="130" y="210" width="61.195450117" height="30" rx="3" fill="#0b756b"/><text x="201.195450117" y="231" fill="#193747" font-size="13" font-weight="600" text-anchor="start">9.4%</text><text x="800" y="231" fill="#526672" font-size="12" font-weight="400" text-anchor="start">E=1.4 · q₀=0.2</text><text x="25" y="286" fill="#193747" font-size="14" font-weight="600" text-anchor="start">Forest 4</text><rect x="130" y="268" width="15.194380593" height="30" rx="3" fill="#0b756b"/><text x="155.194380593" y="289" fill="#193747" font-size="13" font-weight="600" text-anchor="start">2.3%</text><text x="800" y="289" fill="#526672" font-size="12" font-weight="400" text-anchor="start">E=2.1 · q₀=0.1</text><text x="25" y="354" fill="#a15b15" font-size="13" font-weight="400" text-anchor="start">Normalized exactly on four fixture objects. This is not a trained GFlowNet distribution.</text></g></svg>