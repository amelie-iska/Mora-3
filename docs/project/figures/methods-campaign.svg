<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="campaign-title campaign-desc"><title id="campaign-title">Frozen REAL24 → transfer → two targets</title><desc id="campaign-desc">Protocol only, not a completed timeline. Source publication does not confer training admission.</desc><defs><marker id="campaign-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175c7b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#182637"><text x="30" y="40" font-size="25" font-weight="700">Frozen REAL24 → transfer → two targets</text><text x="30" y="68" font-size="14" fill="#536477">Architecture / mathematical illustration — not an empirical result</text><g class="diagram-node" data-detail="A real release requires source rights/coverage, matching construction/model evidence, complete operators and all enabled parameter axes. No manuscript creates authority." role="button" tabindex="0" aria-label="Qualified frozen snapshot"><rect x="30" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="48" y="138" font-size="19" font-weight="700">Qualified frozen snapshot</text><text x="48" y="165" font-size="15" fill="#536477">Full sources and all heads</text><text x="48" y="186" font-size="15" fill="#536477">Recovery · resources · ownership</text></g><g class="diagram-node" data-detail="Use the immutable native grid and durable counted reservations. Do not add retries, intermediate runs or training ablations." role="button" tabindex="0" aria-label="24 existing proxy slots"><rect x="390" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="408" y="138" font-size="19" font-weight="700">24 existing proxy slots</text><text x="408" y="165" font-size="15" fill="#536477">3 rates × 2 × 2 × 2 seeds</text><text x="408" y="186" font-size="15" fill="#536477">Failures keep their slots</text></g><g class="diagram-node" data-detail="Wait for all 24 distinct terminal records, then apply the frozen paired-seed macro-normalized validation selector. Test data and target tuning never choose the point." role="button" tabindex="0" aria-label="Validation-only selector"><rect x="750" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="768" y="138" font-size="19" font-weight="700">Validation-only selector</text><text x="768" y="165" font-size="15" fill="#536477">Matched reference and exposure</text><text x="768" y="186" font-size="15" fill="#536477">Both paired seeds eligible</text></g><g class="diagram-node" data-detail="Evaluate the designated real target checkpoints and report denominators, uncertainty and failure rates. No test result is invented." role="button" tabindex="0" aria-label="Checkpoint-linked evals"><rect x="30" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="48" y="338" font-size="19" font-weight="700">Checkpoint-linked evals</text><text x="48" y="365" font-size="15" fill="#536477">Frozen native task metrics</text><text x="48" y="386" font-size="15" fill="#536477">Populate empty result artifacts</text></g><g class="diagram-node" data-detail="Construct and train the actual approximately 80M full model at predeclared target structure and budget using transferred settings, not target tuning." role="button" tabindex="0" aria-label="At most two target runs"><rect x="390" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="408" y="338" font-size="19" font-weight="700">At most two target runs</text><text x="408" y="365" font-size="15" fill="#536477">Ordinary full-model training</text><text x="408" y="386" font-size="15" fill="#536477">Retain μP parameterization</text></g><g class="diagram-node" data-detail="Check the selected values in the qualified native target factory and actual optimizer. Transfer completion and target training completion are distinct." role="button" tabindex="0" aria-label="Verify actual transfer"><rect x="750" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="768" y="338" font-size="19" font-weight="700">Verify actual transfer</text><text x="768" y="365" font-size="15" fill="#536477">Read back native owner / optimizer</text><text x="768" y="386" font-size="15" fill="#536477">Generated configs are insufficient</text></g><path d="M330 172 L390 172" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#campaign-arrow)"/><path d="M690 172 L750 172" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#campaign-arrow)"/><path d="M900 235 L900 310" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#campaign-arrow)"/><path d="M750 372 L690 372" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#campaign-arrow)"/><path d="M390 372 L330 372" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#campaign-arrow)"/><text x="30" y="480" font-size="14" fill="#94531e">Protocol only, not a completed timeline. Source publication does not confer training admission.</text></g></svg>