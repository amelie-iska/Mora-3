<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="figure-directed-composition-and-metric-persistence-answer-different-questions-title figure-directed-composition-and-metric-persistence-answer-different-questions-desc" viewBox="0 0 960 500" width="960" height="500"><title id="figure-directed-composition-and-metric-persistence-answer-different-questions-title">Directed composition and metric persistence answer different questions</title><desc id="figure-directed-composition-and-metric-persistence-answer-different-questions-desc">Two directed paths remain different unless a defining square is supplied. A separate unit-square metric example has one H1 interval from one to square root two.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#526672" stroke-width="1.3"/></marker></defs><rect width="960" height="500" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="25" y="31" fill="#193747" font-size="20" font-weight="650" text-anchor="start">Directed composition and metric persistence answer different questions</text><text x="25" y="65" fill="#193747" font-size="16" font-weight="600" text-anchor="start">Directed target presentation</text><text x="535" y="65" fill="#193747" font-size="16" font-weight="600" text-anchor="start">Separate metric Rips filtration</text><polygon points="210,110 90,230 210,350 330,230" fill="#0b756b" fill-opacity=".1"/><line x1="210" y1="110" x2="99.899494937" y2="220.100505063" stroke="#0b756b" stroke-width="2"  marker-end="url(#arrow)"/><text x="135" y="170" fill="#0b756b" font-size="17" font-weight="600" text-anchor="start">a</text><line x1="90" y1="230" x2="200.100505063" y2="340.100505063" stroke="#0b756b" stroke-width="2"  marker-end="url(#arrow)"/><text x="135" y="290" fill="#0b756b" font-size="17" font-weight="600" text-anchor="start">b</text><line x1="210" y1="110" x2="320.100505063" y2="220.100505063" stroke="#0b756b" stroke-width="2"  marker-end="url(#arrow)"/><text x="255" y="170" fill="#0b756b" font-size="17" font-weight="600" text-anchor="start">c</text><line x1="330" y1="230" x2="219.899494937" y2="340.100505063" stroke="#0b756b" stroke-width="2"  marker-end="url(#arrow)"/><text x="278" y="290" fill="#0b756b" font-size="17" font-weight="600" text-anchor="start">d</text><circle cx="210" cy="110" r="10" fill="#193747"/><text x="225" y="100" fill="#526672" font-size="12" font-weight="400" text-anchor="start">start</text><circle cx="90" cy="230" r="10" fill="#193747"/><text x="105" y="220" fill="#526672" font-size="12" font-weight="400" text-anchor="start">state 1</text><circle cx="330" cy="230" r="10" fill="#193747"/><text x="345" y="220" fill="#526672" font-size="12" font-weight="400" text-anchor="start">state 2</text><circle cx="210" cy="350" r="10" fill="#193747"/><text x="225" y="340" fill="#526672" font-size="12" font-weight="400" text-anchor="start">finish</text><text x="210" y="224" fill="#0b756b" font-size="22" font-weight="600" text-anchor="middle">ab ∼ cd</text><text x="210" y="252" fill="#526672" font-size="13" font-weight="400" text-anchor="middle">supplied 2-cell</text><rect x="32" y="399" width="391" height="25" rx="5" fill="#0b756b" fill-opacity=".09"/><text x="41" y="416" fill="#0b756b" font-size="12" font-weight="600" text-anchor="start">1 path class · mapping preserved</text><text x="32" y="450" fill="#526672" font-size="13" font-weight="400" text-anchor="start">Reverse finish → start is not reachable.</text><line x1="615" y1="110" x2="825" y2="110" stroke="#206a95" stroke-width="2"  /><line x1="615" y1="110" x2="615" y2="320" stroke="#206a95" stroke-width="2"  /><line x1="825" y1="110" x2="825" y2="320" stroke="#206a95" stroke-width="2"  /><line x1="825" y1="320" x2="615" y2="320" stroke="#206a95" stroke-width="2"  /><circle cx="615" cy="110" r="8" fill="#206a95"/><circle cx="825" cy="110" r="8" fill="#206a95"/><circle cx="825" cy="320" r="8" fill="#206a95"/><circle cx="615" cy="320" r="8" fill="#206a95"/><text x="720" y="217" fill="#193747" font-size="20" font-weight="650" text-anchor="middle">H₀=1    H₁=1</text><text x="535" y="350" fill="#526672" font-size="13" font-weight="400" text-anchor="start">ε = 1.20 · complete H₁ interval [1, √2)</text><line x1="550" y1="385" x2="905.2" y2="385" stroke="#c5d0d2" stroke-width="2"  /><line x1="772" y1="385" x2="863.955410847" y2="385" stroke="#206a95" stroke-width="7"  /><circle cx="772" cy="385" r="5" fill="#206a95"/><circle cx="863.955410847" cy="385" r="5" fill="white" stroke="#206a95" stroke-width="2"/><line x1="816.4" y1="365" x2="816.4" y2="408" stroke="#a15b15" stroke-width="2"  /><text x="772" y="426" fill="#526672" font-size="12" font-weight="400" text-anchor="middle">1</text><text x="863.955410847" y="426" fill="#526672" font-size="12" font-weight="400" text-anchor="middle">√2</text><text x="535" y="463" fill="#a15b15" font-size="12" font-weight="400" text-anchor="start">Barcode similarity cannot certify a directed analogy.</text></g></svg>