<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="refinement-title refinement-desc"><title id="refinement-title">Propose, retain, edit, decode, verify</title><desc id="refinement-desc">Return K distinct qualified outputs only when present; otherwise report the shortfall.</desc><defs><marker id="refinement-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#175c7b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#182637"><text x="30" y="40" font-size="25" font-weight="700">Propose, retain, edit, decode, verify</text><text x="30" y="68" font-size="14" fill="#536477">Architecture / mathematical illustration — not an empirical result</text><g class="diagram-node" data-detail="Generate multiple full candidates using a bound policy and field. Independent noise draws do not guarantee semantic diversity or good answers." role="button" tabindex="0" aria-label="Several complete proposals"><rect x="30" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="48" y="138" font-size="19" font-weight="700">Several complete proposals</text><text x="48" y="165" font-size="15" fill="#536477">Explicit topology / flow RNG</text><text x="48" y="186" font-size="15" fill="#536477">No guaranteed initial quality</text></g><g class="diagram-node" data-detail="Evaluate complete candidate traces and supported nodes. Retain prior candidates and record immutable assessments." role="button" tabindex="0" aria-label="Score the entire forest"><rect x="390" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="408" y="138" font-size="19" font-weight="700">Score the entire forest</text><text x="408" y="165" font-size="15" fill="#536477">Frozen whole/node criteria</text><text x="408" y="186" font-size="15" fill="#536477">Keep earlier candidates</text></g><g class="diagram-node" data-detail="Edit only within declared constraints. Record lineage, proposal budgets and failures. Edited samples are not unchanged on-policy GFlowNet samples." role="button" tabindex="0" aria-label="Bounded branch edits"><rect x="750" y="110" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="768" y="138" font-size="19" font-weight="700">Bounded branch edits</text><text x="768" y="165" font-size="15" fill="#536477">Correction or improvement</text><text x="768" y="186" font-size="15" fill="#536477">Record parent and operation</text></g><g class="diagram-node" data-detail="After decoding, assess actual output structure and native domain constraints. Missing evidence stays unknown, not pass." role="button" tabindex="0" aria-label="Independent output checks"><rect x="30" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="48" y="338" font-size="19" font-weight="700">Independent output checks</text><text x="48" y="365" font-size="15" fill="#536477">Grammar and native criteria</text><text x="48" y="386" font-size="15" fill="#536477">Repairable failure is explicit</text></g><g class="diagram-node" data-detail="Decode only complete latent forests under the exact codebook axis. Refuse overflow instead of silently truncating outputs." role="button" tabindex="0" aria-label="Token refinement"><rect x="390" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="408" y="338" font-size="19" font-weight="700">Token refinement</text><text x="408" y="365" font-size="15" fill="#536477">Nearest permitted codebook</text><text x="408" y="386" font-size="15" fill="#536477">Complete stop / capacity check</text></g><g class="diagram-node" data-detail="Retain valid or repairable candidates across rounds. Repeated proposals still consume the explicit proposal budget." role="button" tabindex="0" aria-label="Retained candidate pool"><rect x="750" y="310" width="300" height="125" rx="9" fill="#f3f6f8" stroke="#c7d4df"/><text x="768" y="338" font-size="19" font-weight="700">Retained candidate pool</text><text x="768" y="365" font-size="15" fill="#536477">Elites and distinct candidates</text><text x="768" y="386" font-size="15" fill="#536477">Budgeted additional edits</text></g><path d="M330 172 L390 172" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#refinement-arrow)"/><path d="M690 172 L750 172" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#refinement-arrow)"/><path d="M900 235 L900 310" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#refinement-arrow)"/><path d="M750 372 L690 372" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#refinement-arrow)"/><path d="M390 372 L330 372" fill="none" stroke="#175c7b" stroke-width="2" marker-end="url(#refinement-arrow)"/><text x="30" y="480" font-size="14" fill="#94531e">Return K distinct qualified outputs only when present; otherwise report the shortfall.</text></g></svg>